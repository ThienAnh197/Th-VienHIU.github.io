spring.application.name=staffflow
server.port=8080

# PHASE 1-4: dữ liệu trong bộ nhớ. PHASE 5 đổi thành "sqlserver" (xem application-example.properties).
spring.profiles.active=memory

# Hồ sơ "memory" không dùng cơ sở dữ liệu thật, nhưng pom.xml có spring-boot-starter-jdbc (cho Phase 5) nên
# Spring Boot sẽ tự cố tạo DataSource khi khởi động nếu không tắt dòng này -> lỗi "Failed to configure a
# DataSource ... no embedded datasource could be configured". Hồ sơ "sqlserver" ghi đè dòng này thành rỗng
# (xem application-example.properties) để bật lại DataSource/JdbcTemplate thật.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration

# Giờ Việt Nam
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Session an toàn
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m

# Thời điểm "bây giờ" cố định cho dữ liệu demo (để kết quả test lặp lại được).
# Để trống (staffflow.demo-now=) để dùng giờ thật của máy.
staffflow.demo-now=2026-10-18T15:00
# Thứ Hai của tuần demo chính (tuần có K1 thấp ~46%)
staffflow.demo-week-start=2026-10-19